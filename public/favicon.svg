<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <title>AgentMux icon</title>
  <style>
    .edge, .tile { fill: #111016; }
    .block { fill: #6b82de; }
    @media (prefers-color-scheme: light) {
      .edge { fill: #cfcce2; }
      .tile { fill: #f3f2f8; }
      .block { fill: #4b5fcf; }
    }
  </style>
  <rect class="edge" width="512" height="512"/>
  <rect class="tile" x="32" y="32" width="448" height="448"/>
  <rect class="block" x="64" y="64" width="384" height="64"/>
  <rect class="block" x="64" y="192" width="160" height="256"/>
  <rect class="block" x="288" y="192" width="160" height="96"/>
  <rect class="block" x="288" y="352" width="160" height="96"/>
</svg>
