<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>TurnPhase state machine</title>
  <defs>
    <style>
      .bp { fill: #ffffff; stroke: #8168d3; stroke-width: 1.5; }
      .bs { fill: #ffffff; stroke: #5e8fd9; stroke-width: 1.5; }
      .bg { fill: #ffffff; stroke: #8b8b95; stroke-width: 1.5; }
      .t  { font-weight: 700; font-size: 13px; fill: #1c1c1f; }
      .s  { font-size: 11px; fill: #44444c; }
      .e  { stroke: #8b8b95; stroke-width: 1.5; fill: none; }
      .ep { stroke: #8168d3; stroke-width: 1.5; fill: none; }
      .el { font-size: 10px; fill: #44444c; }
      .elp { font-size: 10px; fill: #8168d3; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .bp, .bs, .bg { fill: #1a1a1e; }
        .t  { fill: #f0f0f5; }
        .s  { fill: #b8b8c2; }
        .e  { stroke: #6a6a78; }
        .el { fill: #b8b8c2; }
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#8b8b95"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#8168d3"/>
    </marker>
  </defs>

  <!-- Idle -->
  <rect class="bg" x="30" y="170" width="140" height="64" rx="8"/>
  <text class="t" x="100" y="198" text-anchor="middle">Idle</text>
  <text class="s" x="100" y="218" text-anchor="middle">no turn in flight</text>

  <!-- Arrow: Idle → Submitting -->
  <line class="e" x1="170" y1="202" x2="228" y2="202" marker-end="url(#a)"/>

  <!-- Submitting -->
  <rect class="bg" x="233" y="170" width="160" height="64" rx="8"/>
  <text class="t" x="313" y="198" text-anchor="middle">Submitting</text>
  <text class="s" x="313" y="218" text-anchor="middle">awaiting first event</text>

  <!-- Arrow: Submitting → Streaming -->
  <line class="e" x1="393" y1="202" x2="453" y2="202" marker-end="url(#a)"/>
  <text class="el" x="423" y="195" text-anchor="middle">first stream</text>
  <text class="el" x="423" y="207" text-anchor="middle">event</text>

  <!-- Streaming -->
  <rect class="bg" x="458" y="170" width="160" height="64" rx="8"/>
  <text class="t" x="538" y="198" text-anchor="middle">Streaming</text>
  <text class="s" x="538" y="218" text-anchor="middle">stream producing</text>

  <!-- Arrow: Streaming → Interrupting -->
  <line class="e" x1="618" y1="202" x2="676" y2="202" marker-end="url(#a)"/>
  <text class="el" x="647" y="195" text-anchor="middle">Request</text>
  <text class="el" x="647" y="207" text-anchor="middle">Stop</text>

  <!-- Interrupting -->
  <rect class="bg" x="681" y="170" width="149" height="64" rx="8"/>
  <text class="t" x="755" y="194" text-anchor="middle">Interrupting</text>
  <text class="s" x="755" y="210" text-anchor="middle">stop requested</text>
  <text class="s" x="755" y="224" text-anchor="middle">awaiting TurnEnd</text>

  <!-- Done (steel-blue, terminal) -->
  <rect class="bs" x="560" y="340" width="160" height="72" rx="8"/>
  <text class="t" x="640" y="366" text-anchor="middle">Done — terminal</text>
  <text class="s" x="640" y="384" text-anchor="middle">completed | stopped</text>
  <text class="s" x="640" y="400" text-anchor="middle">interrupted | errored</text>

  <!-- Disconnected (steel-blue) -->
  <rect class="bs" x="340" y="340" width="170" height="72" rx="8"/>
  <text class="t" x="425" y="366" text-anchor="middle">Disconnected</text>
  <text class="s" x="425" y="384" text-anchor="middle">stream dropped mid-turn</text>
  <text class="s" x="425" y="400" text-anchor="middle">remembers lastKind</text>

  <!-- Arrow: Submitting → Done (timeout, purple) -->
  <path class="ep" d="M313,234 L313,310 L600,310 L600,340" marker-end="url(#ap)"/>
  <text class="elp" x="308" y="275" text-anchor="end">SubmitTimeoutElapsed (30s)</text>
  <text class="elp" x="308" y="288" text-anchor="end">→ errored</text>

  <!-- Arrow: Streaming → Done (stalled, purple) -->
  <path class="ep" d="M538,234 L538,290 L620,290 L620,340" marker-end="url(#ap)"/>
  <text class="elp" x="543" y="268">StreamStalled (60s)</text>
  <text class="elp" x="543" y="281">→ errored</text>

  <!-- Arrow: Streaming → Disconnected -->
  <path class="e" d="M458,234 L458,260 L425,260 L425,340" marker-end="url(#a)"/>
  <text class="el" x="430" y="278">stream</text>
  <text class="el" x="430" y="291">dropped</text>

  <!-- Arrow: Interrupting → Done (TurnEnd / unsub) -->
  <path class="e" d="M755,234 L755,310 L660,310 L660,340" marker-end="url(#a)"/>
  <text class="el" x="718" y="275" text-anchor="middle">TurnEnd / unsub</text>
  <text class="el" x="718" y="288" text-anchor="middle">→ interrupted</text>

  <!-- Arrow: Interrupting → Done (timeout, purple) -->
  <path class="ep" d="M830,234 L830,320 L690,320 L690,340" marker-end="url(#ap)"/>
  <text class="elp" x="768" y="308" text-anchor="middle">InterruptTimeout (5s)</text>

  <!-- Legend — placed below the terminal-state boxes (which bottom at y=412) -->
  <line class="e" x1="30" y1="430" x2="70" y2="430"/>
  <text class="el" x="76" y="434">normal transition</text>
  <line class="ep" x1="200" y1="430" x2="240" y2="430"/>
  <text class="elp" x="246" y="434">timeout / error transition</text>
  <rect class="bs" x="430" y="422" width="16" height="16" rx="3"/>
  <text class="el" x="452" y="434">terminal state</text>
</svg>
