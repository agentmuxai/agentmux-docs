<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Interagent communications — three-tier delivery model</title>
  <defs>
    <style>
      .bp { fill: #ffffff; stroke: #8168d3; stroke-width: 1.5; }
      .bs { fill: #ffffff; stroke: #5e8fd9; stroke-width: 1.5; }
      .bb { fill: #ffffff; stroke: #419fe0; stroke-width: 1.5; }
      .t  { font-weight: 700; font-size: 14px; fill: #1c1c1f; }
      .s  { font-size: 12px; fill: #44444c; }
      .cp { font-size: 11.5px; font-weight: 600; fill: #8168d3; }
      .cs { font-size: 11.5px; font-weight: 600; fill: #5e8fd9; }
      .cb { font-size: 11.5px; font-weight: 600; fill: #419fe0; }
      .es { stroke: #5e8fd9; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .eb { stroke: #419fe0; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .ls { font-size: 11px; fill: #5e8fd9; font-weight: 600; }
      .lb { font-size: 11px; fill: #419fe0; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .bp, .bs, .bb { fill: #1a1a1e; }
        .t { fill: #f0f0f5; }
        .s { fill: #b8b8c2; }
      }
    </style>
    <marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#5e8fd9"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#419fe0"/>
    </marker>
  </defs>

  <!-- Host tier -->
  <rect class="bp" x="30" y="30" width="660" height="104" rx="8"/>
  <text class="t" x="360" y="59"  text-anchor="middle">Host tier — in-process reactive handler</text>
  <text class="s" x="360" y="80"  text-anchor="middle">per-launch auth key · always on · ~same-process latency</text>
  <text class="s" x="360" y="99"  text-anchor="middle" style="font-style:italic">Agent A ──jekt──▶ Agent B</text>
  <text class="cp" x="360" y="120" text-anchor="middle">always on</text>

  <!-- Arrow 1 -->
  <line class="es" x1="360" y1="134" x2="360" y2="183" marker-end="url(#ms)"/>
  <text class="ls" x="368" y="162">mDNS peer-to-peer</text>

  <!-- LAN tier -->
  <rect class="bs" x="30" y="188" width="660" height="88" rx="8"/>
  <text class="t"  x="360" y="217" text-anchor="middle">LAN tier — mDNS-discovered peer instances</text>
  <text class="s"  x="360" y="238" text-anchor="middle">peer auth key from mDNS registry · off by default · ~LAN latency</text>
  <text class="cs" x="360" y="260" text-anchor="middle">off by default — enable via HostPopover → LAN discovery</text>

  <!-- Arrow 2 -->
  <line class="eb" x1="360" y1="276" x2="360" y2="325" marker-end="url(#mb)"/>
  <text class="lb" x="368" y="304">cloud relay (opt-in)</text>

  <!-- WAN tier -->
  <rect class="bb" x="30" y="330" width="660" height="88" rx="8"/>
  <text class="t"  x="360" y="359" text-anchor="middle">WAN tier — agentbus cloud relay (opt-in)</text>
  <text class="s"  x="360" y="380" text-anchor="middle">bearer token · outbound poll only · you operate the relay</text>
  <text class="cb" x="360" y="402" text-anchor="middle">off by default — outbound poll only, relay never calls in</text>
</svg>
