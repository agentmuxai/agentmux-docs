<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
  <title>AgentMux four-process architecture</title>
  <desc>agentmux-launcher (1 per channel-and-version pair, enforced via a single-instance named-pipe lock under that pair's runtime/ dir) spawns agentmux-cef. The host then embeds Chromium via CEF (1 main renderer + N renderer subprocesses, one per browser pane) and auto-spawns agentmux-srv (the sidecar) on a dynamic port. The main renderer loads the SolidJS frontend, which talks to the srv sidecar over a WebSocket.</desc>

  <defs>
    <style>
      .surface   { fill: #fafbfc; stroke: none; }
      .box       { fill: #ffffff; stroke: #8168d3; stroke-width: 1.5; rx: 10; ry: 10; }
      .box-alt   { fill: #ffffff; stroke: #419fe0; stroke-width: 1.5; rx: 10; ry: 10; }
      .sidecar   { fill: #ffffff; stroke: #5e8fd9; stroke-width: 1.5; rx: 10; ry: 10; }

      .title     { font-weight: 700; font-size: 18px; fill: #1c1c1f; }
      .sub       { font-size: 14px; fill: #44444c; }
      .card      { font-size: 12.5px; font-weight: 600; fill: #8168d3; letter-spacing: 0.3px; }
      .card-alt  { font-size: 12.5px; font-weight: 600; fill: #419fe0; letter-spacing: 0.3px; }
      .card-side { font-size: 12.5px; font-weight: 600; fill: #5e8fd9; letter-spacing: 0.3px; }

      .edge        { stroke: #8b8b95; stroke-width: 1.5; fill: none; }
      .edge-label  { font-size: 13px; fill: #44444c; font-weight: 500; }
      .ipc         { stroke: #8168d3; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .ipc-label   { font-size: 13px; fill: #8168d3; font-weight: 700; }
      .bullet      { font-size: 14px; fill: #44444c; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8b95"/>
    </marker>
    <marker id="arrow-ipc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8168d3"/>
    </marker>
  </defs>

  <!-- Surface — explicit light background so the SVG renders consistently on dark Starlight themes too -->
  <rect class="surface" x="0" y="0" width="960" height="580"/>

  <!-- Row 1: launcher (left) -->
  <g>
    <rect class="box" x="40" y="30" width="280" height="110"/>
    <text class="title" x="180" y="62" text-anchor="middle">agentmux-launcher</text>
    <text class="sub"   x="180" y="86" text-anchor="middle">~325 KB shim · spawns the host</text>
    <text class="card"  x="180" y="115" text-anchor="middle">×1 per (channel, version)</text>
    <text class="sub"   x="180" y="132" text-anchor="middle" style="font-size:12px;">(single-instance via named-pipe lock)</text>
  </g>

  <!-- Row 1: cef host (right) -->
  <g>
    <rect class="box" x="640" y="30" width="280" height="110"/>
    <text class="title" x="780" y="62" text-anchor="middle">agentmux-cef</text>
    <text class="sub"   x="780" y="86" text-anchor="middle">the "host" · Rust + CEF bindings</text>
    <text class="card"  x="780" y="115" text-anchor="middle">×1 per launcher</text>
    <text class="sub"   x="780" y="132" text-anchor="middle" style="font-size:12px;">(owns OS window + JS bridge)</text>
  </g>

  <!-- IPC link: launcher <-> host (named pipe, bidirectional) -->
  <line class="ipc" x1="320" y1="85" x2="640" y2="85" marker-start="url(#arrow-ipc)" marker-end="url(#arrow-ipc)"/>
  <text class="ipc-label" x="480" y="76" text-anchor="middle">named pipe</text>

  <!-- Row 2: Chromium (renderer) -->
  <g>
    <rect class="box-alt" x="640" y="190" width="280" height="100"/>
    <text class="title"  x="780" y="222" text-anchor="middle">Chromium</text>
    <text class="sub"    x="780" y="244" text-anchor="middle">CEF renderer (+ utility procs)</text>
    <text class="card-alt" x="780" y="270" text-anchor="middle">×1 main + ×N per browser pane</text>
  </g>
  <path class="edge" d="M780,140 L780,190" marker-end="url(#arrow)"/>
  <text class="edge-label" x="790" y="168">embeds</text>

  <!-- Row 3: SolidJS frontend -->
  <g>
    <rect class="box-alt" x="640" y="330" width="280" height="100"/>
    <text class="title"  x="780" y="362" text-anchor="middle">SolidJS app</text>
    <text class="sub"    x="780" y="384" text-anchor="middle">the frontend · Vite-built bundle</text>
    <text class="card-alt" x="780" y="410" text-anchor="middle">×1 per host (in main renderer)</text>
  </g>
  <path class="edge" d="M780,290 L780,330" marker-end="url(#arrow)"/>
  <text class="edge-label" x="790" y="314">JS bridge</text>

  <!-- Row 4: agentmux-srv sidecar, spanning full width -->
  <g>
    <rect class="sidecar" x="40" y="480" width="880" height="90"/>
    <text class="title"    x="480" y="510" text-anchor="middle">agentmux-srv  ·  sidecar</text>
    <text class="bullet"   x="180" y="538" text-anchor="middle">RPC engine (websocket)</text>
    <text class="bullet"   x="430" y="538" text-anchor="middle">saga coordinator · event bus</text>
    <text class="bullet"   x="700" y="538" text-anchor="middle">SQLite persistence</text>
    <text class="card-side" x="480" y="560" text-anchor="middle">×1 per launcher · dynamic port · Rust + Tokio + Axum</text>
  </g>

  <!-- host -> srv (auto-spawns the sidecar on a dynamic port). Routed along the left margin of the right column so it doesn't collide with the JS bridge / websocket arrows. -->
  <path class="edge" d="M640,90 L600,90 L600,510 L640,510" marker-end="url(#arrow)"/>
  <text class="edge-label" x="490" y="300" text-anchor="end">auto-spawns sidecar</text>

  <!-- solidjs -> srv (websocket) -->
  <path class="edge" d="M780,430 L780,480" marker-end="url(#arrow)"/>
  <text class="edge-label" x="790" y="458">websocket</text>
</svg>
