name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # The docs live in the agentmux-prod account (167667034757) since
    # 2026-09-28: bucket, distribution and the deploy role below are its
    # agentmux-docs-prod stack (agentmuxai/agentmux-landing cdk/lib/docs-stack.ts).
    # The shared account's agentmux-docs-prod bucket and EF4XTPT79GHLS are
    # retired; the CF_DISTRIBUTION_ID secret is no longer used.
    env:
      DOCS_BUCKET: agentmux-docs-prod-167667034757
      DOCS_DISTRIBUTION_ID: E4EAW1TLB65KC

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries for cargo doc
        # `cargo doc` runs every dependency's build script, and on Linux the
        # agentmux crates' -sys dependencies look up system libraries with
        # pkg-config. Without these the Rust reference fails to build
        # (agentmux-docs#131: wayland-sys could not find wayland-client).
        # Same set agentmux's own ci-pr.yml installs for its CEF-free crates:
        #   libwayland-dev, libxkbcommon-dev: agentmux-launcher's splash
        #   libdbus-1-dev, libxcb1-dev: agentmux-mcp's screen capture (xcap)
        # agentmux-cef needs nothing extra: build-rust-docs.mjs documents it
        # with `cef/dox`, which skips the CEF download and native build.
        #
        # The runner ships a google-chrome apt source we install nothing from;
        # a corrupt index there fails `apt-get update` (agentmux saw this on
        # 2026-09-09), so drop it. `apt-get install` is still the real gate.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || echo "apt-get update reported errors; continuing (install is the real gate)"
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libdbus-1-dev libxcb1-dev

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (full — typedoc + rustdoc + astro)
        run: npm run build:full

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::167667034757:role/agentmux-docs-deploy
          aws-region: us-east-1

      - name: Sync non-HTML assets to S3
        run: |
          aws s3 sync dist/ s3://${{ env.DOCS_BUCKET }}/ \
            --delete \
            --exclude "*.html"

      - name: Force-upload HTML files
        # normalize-mtimes sets all dist mtimes to a fixed epoch so s3 sync
        # skips HTML when only the CSS hash inside it changes. Always force-
        # upload HTML to prevent stale pages referencing deleted CSS bundles.
        run: |
          aws s3 cp dist/ s3://${{ env.DOCS_BUCKET }}/ \
            --recursive \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          INVAL=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.DOCS_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVAL"
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ env.DOCS_DISTRIBUTION_ID }} \
            --id "$INVAL"

      - name: Verify — CSS hash must match between live site and S3
        run: |
          LIVE=$(curl -sf "https://docs.agentmux.ai/user-guide/" \
            | grep -o 'common\.[^"]*\.css' | head -1)
          S3=$(aws s3 ls s3://${{ env.DOCS_BUCKET }}/_astro/ \
            | grep common | awk '{print $4}')
          echo "Live: $LIVE"
          echo "S3:   $S3"
          if [ "$LIVE" != "$S3" ]; then
            echo "CSS hash mismatch — HTML may not have been uploaded correctly"
            exit 1
          fi
          echo "✓ CSS hash matches — deploy verified"
