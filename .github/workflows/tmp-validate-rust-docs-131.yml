# TEMPORARY — validation for agentmux-docs#131. Removed before the PR is ready.
# Mirrors deploy.yml's build steps exactly, with no AWS steps at all.
name: TMP validate rust docs (#131)

on:
  push:
    branches: [agenty/fix-rust-api-docs-131]

permissions:
  contents: read

jobs:
  # Positive: deploy.yml's build with the new apt step must produce the real
  # Rust reference for every crate the placeholder links to.
  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries for cargo doc
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          sudo apt-get update || echo "apt-get update reported errors; continuing (install is the real gate)"
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libdbus-1-dev libxcb1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (full — typedoc + rustdoc + astro)
        run: npm run build:full
      - name: Assert real rustdoc output in dist
        run: |
          set -e
          for c in agentmux_cef agentmux_srv agentmux_launcher agentmux_common; do
            test -f "dist/api/rust/$c/index.html" || { echo "::error::missing dist/api/rust/$c/index.html"; exit 1; }
            echo "ok: dist/api/rust/$c/index.html ($(find dist/api/rust/$c -name '*.html' | wc -l) html files)"
          done
          test -d dist/api/rust/static.files
          # cef/dox must have skipped the CEF binary download entirely.
          if find src/agentmux/target -name 'libcef.so' | grep -q .; then echo "::error::CEF binary was downloaded"; exit 1; fi
          echo "ok: no CEF binary downloaded"
          du -sh src/agentmux/target

  # Negative: without the system libraries, build:rust-docs must now FAIL in
  # CI instead of exiting 0 with the placeholder (the #131 regression).
  fails-loudly-without-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: build:rust-docs must exit non-zero
        run: |
          if node scripts/build-rust-docs.mjs; then
            echo "::error::build-rust-docs exited 0 without system libraries"; exit 1
          fi
          echo "ok: build-rust-docs failed loudly as expected"
