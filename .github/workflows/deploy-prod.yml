# =============================================================================
# Production deploy — agentmux-docs (SUPERSEDED, kept as a documented fallback)
# =============================================================================
#
# 2026-07-29 (DOC-007, documentation analyst): the "Activation" section below
# described one-time OIDC/IAM setup as NOT YET DONE. It's done — `deploy.yml`
# (added 2026-06-27, PR #97) has been auto-deploying every push to `main` in
# production since, using an already-provisioned role
# (`arn:aws:iam::050544946291:role/agentmux-docs-deploy`) and an already-set
# `CF_DISTRIBUTION_ID` secret. This file's old "DORMANT, needs activation"
# framing was stale, and — separately — its sync step below was still the
# single-pass `aws s3 sync --delete` pattern that caused the 2026-05-27
# partial-deploy incident (stale HTML referencing a deleted CSS bundle,
# because `normalize-mtimes.mjs` pins mtimes so `s3 sync` skips HTML whose
# byte size/mtime didn't change even when the CSS hash inside it did).
# Fixed to the same two-step (asset sync, then forced HTML upload) sequence
# `deploy.yml` uses. This workflow itself is still `workflow_dispatch`-only
# and not wired into normal CI — `deploy.yml` is the live pipeline. Whether
# to delete this file entirely (now that the thing it was building toward
# already exists and works) or keep it as a documented manual-recovery path
# is a call for whoever owns this repo's CI, not something to guess at in a
# doc-accuracy pass — left as-is, just no longer describing false state.
#
# What this workflow does (manual dispatch only):
#   1. Check out the repo with submodules (src/agentmux is required for
#      build:typedoc and build:rust-docs).
#   2. Set up Node 22 + a minimal Rust stable toolchain.
#   3. Cache npm + cargo.
#   4. npm ci
#   5. npm run build:full   (typedoc → rustdoc → astro)
#   6. Assume the AWS IAM role via GitHub OIDC.
#   7. Two-step S3 sync (assets, then forced HTML upload — see deploy.yml's
#      identical step for why this must be two steps, not one).
#   8. aws cloudfront create-invalidation --distribution-id EF4XTPT79GHLS \
#                                          --paths "/*"
#
# =============================================================================

name: Deploy production

on:
  # Manual dispatch only. deploy.yml is the live push-to-main pipeline (see
  # the header above) — this workflow is a documented manual-recovery path,
  # not wired into normal CI.
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  # OIDC token request — required by aws-actions/configure-aws-credentials.
  id-token: write
  contents: read

concurrency:
  # Cancel in-flight deploys when a newer commit lands; we always want the
  # most recent main to be what's on prod.
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The agentmux submodule is pinned by SHA in .gitmodules; we just
          # need it present, not on a moving branch.
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Rust (stable, minimal)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/agentmux/target
          # The src/agentmux pointer (a gitlink object) is part of the
          # tree hash, so changes to the submodule SHA invalidate the cache.
          key: cargo-${{ runner.os }}-${{ hashFiles('.gitmodules', 'src/agentmux/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install npm deps
        run: npm ci

      - name: Build site (typedoc + rustdoc + astro)
        run: npm run build:full

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Same role deploy.yml uses — already provisioned and working, not
          # the not-yet-set-up placeholder this file originally described.
          role-to-assume: arn:aws:iam::050544946291:role/agentmux-docs-deploy
          aws-region: us-east-1
          # CloudFront is global; us-east-1 is fine for the SDK endpoint.

      - name: Sync non-HTML assets to S3
        run: |
          aws s3 sync dist/ s3://agentmux-docs-prod/ \
            --delete \
            --exclude "*.html"

      - name: Force-upload HTML files
        # normalize-mtimes sets all dist mtimes to a fixed epoch so s3 sync
        # skips HTML when only the CSS hash inside it changes. Always
        # force-upload HTML to prevent stale pages referencing deleted CSS
        # bundles — see deploy.yml's identical step and the 2026-05-27
        # incident this pattern caused when it was a single sync step.
        run: |
          aws s3 cp dist/ s3://agentmux-docs-prod/ \
            --recursive \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EF4XTPT79GHLS \
            --paths "/*"
