name: PR Check

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled: the `line-links-reviewed` label decides a step below.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # check-line-links.mjs diffs the PR against its merge base.
          fetch-depth: 0

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The TypeScript reference (typedoc) plus the site, not build:full:
        # the Rust reference needs a Rust toolchain and stays a deploy.yml
        # concern, verified there before going live. typedoc is cheap and its
        # pages carry links of their own, which shipped broken unseen while
        # PRs built without it (specs/AUDIT_DEAD_LINKS_2026_10_12.md §3.1).
        # The build itself fails on a link into the agentmux source that
        # doesn't resolve at the pinned commit (plugins/rehype-check-source-links.mjs).
        run: |
          npm run build:typedoc
          npm run build

      - name: Links (every page link and #anchor in the built site)
        # External URLs are fetched too, as warnings only.
        run: node scripts/check-links.mjs --skip-target /api/rust/ --external

      - name: Line links after a src/agentmux bump
        # Lists each link to a source line whose code changed with the new pin.
        # Once a person has checked them, the `line-links-reviewed` label skips
        # this step.
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'line-links-reviewed') }}
        run: node scripts/check-line-links.mjs --base origin/${{ github.base_ref }}

      - name: Layout stability (no scrollbar shift, no hidden header or sidebar)
        # Loads built pages in Chromium with real scrollbars, a cold cache and a
        # throttled connection, and fails if the page width changes or the header
        # or sidebar is invisible after first paint. Guards against "hide until
        # JS runs" masks and scrollbar shifts, both of which shipped before.
        run: |
          npx playwright install --with-deps chromium-headless-shell
          node scripts/check-layout-stability.mjs

      - name: Navigation paint (no empty-content frame on a first visit)
        run: node scripts/check-navigation-paint.mjs

      - name: Accessibility (WCAG 2.2 A/AA, dark and light themes)
        # axe-core on every built page except the generated /api/ reference, in the Chromium
        # installed above. Fails on serious or critical violations, apart from the two known
        # Starlight/Expressive Code ones listed (and still printed) in the script.
        run: node scripts/check-a11y.mjs
